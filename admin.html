<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin | Osahontue</title>
  <style>
    :root { --ink: #14110b; --paper: #fffdf3; --y: #f5c518; --line: rgba(20,17,11,.2); --bad: #b3261e; --ok: #1a7f37; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
    #app { max-width: 920px; margin: 0 auto; padding: 24px 16px 80px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
    h2 { margin: 28px 0 12px; font-size: 18px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0; }
    button, .btn {
      font: inherit; cursor: pointer; border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
      padding: 8px 14px; border-radius: 6px;
    }
    button:hover { background: rgba(20,17,11,.07); }
    button.primary { background: var(--ink); color: var(--y); }
    button.primary:hover { background: #2b2619; }
    button.tab.on { background: var(--y); }
    button.danger { border-color: var(--bad); color: var(--bad); }
    button.danger.armed { background: var(--bad); color: #fff; }
    button:disabled { opacity: .5; cursor: wait; }
    .row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .row .grow { flex: 1; min-width: 0; }
    .row small { opacity: .65; }
    .pill { font-size: 12px; padding: 2px 8px; border: 1px solid var(--ink); border-radius: 99px; white-space: nowrap; }
    .pill.draft { opacity: .55; border-style: dashed; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--ink); flex: none; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
    label small { font-weight: 400; opacity: .65; }
    input, select, textarea {
      font: inherit; width: 100%; padding: 9px 10px; border: 1.5px solid var(--ink); border-radius: 6px;
      background: #fff; color: var(--ink);
    }
    input[type=color] { padding: 2px; height: 40px; }
    input[type=checkbox] { width: auto; }
    textarea { resize: vertical; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .thumb { max-width: 160px; max-height: 100px; border: 1px solid var(--line); border-radius: 6px; display: block; margin-top: 6px; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
    .note { padding: 14px; border: 1.5px dashed var(--ink); border-radius: 8px; }
    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9;
      padding: 10px 16px; border-radius: 8px; background: var(--ink); color: #fff; max-width: 90vw;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #toast.show { opacity: 1; }
    #toast.bad { background: var(--bad); }
    .login { max-width: 360px; margin: 12vh auto 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="/src/admin.js"></script>
</body>
</html>
